name: Fetch Betman Games

on:
  # 수동 실행 (GitHub Actions 탭에서 "Run workflow" 클릭)
  workflow_dispatch:
    inputs:
      gmTs:
        description: '베트맨 회차번호 (예: 260019)'
        required: true
        type: string

jobs:
  fetch-games:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Fetch Betman games
        run: npx tsx scripts/betman-fetch-games.ts ${{ github.event.inputs.gmTs }}
        env:
          NEXT_PUBLIC_APP_URL: ${{ secrets.PRODUCTION_URL }}

      - name: Summary
        run: |
          echo "## Betman Games Fetch Complete" >> $GITHUB_STEP_SUMMARY
          echo "- 회차: ${{ github.event.inputs.gmTs }}" >> $GITHUB_STEP_SUMMARY
          echo "- 시간: $(date '+%Y-%m-%d %H:%M:%S KST')" >> $GITHUB_STEP_SUMMARY
