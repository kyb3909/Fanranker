name: Betman 경기 수집

on:
  schedule:
    # 매일 KST 09:00, 15:00, 21:00 (UTC 00:00, 06:00, 12:00)
    - cron: '0 0,6,12 * * *'
  workflow_dispatch:
    inputs:
      gmTs:
        description: '회차번호 (비워두면 자동 감지)'
        required: false
        default: ''
      check-only:
        description: '최신 회차 확인만 (수집 안함)'
        required: false
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright
        run: pnpm exec playwright install chromium

      - name: Sync Betman data
        id: sync
        env:
          NEXT_PUBLIC_APP_URL: ${{ secrets.PRODUCTION_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.gmTs }}" ]; then
            ARGS="--gmts=${{ github.event.inputs.gmTs }}"
          fi
          if [ "${{ github.event.inputs.check-only }}" = "true" ]; then
            ARGS="$ARGS --check-only"
          fi

          RESULT=$(pnpm exec tsx scripts/betman-sync.ts $ARGS)
          echo "$RESULT"
          echo "result=$RESULT" >> $GITHUB_OUTPUT

      - name: Summary
        run: |
          echo "## Betman 경기 수집 완료" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo '${{ steps.sync.outputs.result }}' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "- 시간: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S KST')" >> $GITHUB_STEP_SUMMARY
