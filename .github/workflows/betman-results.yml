name: Betman 결과 수집 & 정산

on:
  schedule:
    # 매일 KST 07:00, 13:00, 22:00 (UTC 22:00, 04:00, 13:00)
    # 경기 종료 이후 시간대에 실행
    - cron: '0 22,4,13 * * *'
  workflow_dispatch:
    inputs:
      gmTs:
        description: '회차번호 (필수)'
        required: true
        type: string

jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright
        run: pnpm exec playwright install chromium

      - name: Determine gmTs
        id: gmts
        env:
          NEXT_PUBLIC_APP_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          if [ -n "${{ github.event.inputs.gmTs }}" ]; then
            echo "value=${{ github.event.inputs.gmTs }}" >> $GITHUB_OUTPUT
          else
            # 스케줄 실행 시 자동 감지
            RESULT=$(pnpm exec tsx scripts/betman-sync.ts --check-only 2>/dev/null || echo '{}')
            GMTS=$(echo "$RESULT" | grep -o '"gmTs":"[^"]*"' | head -1 | cut -d'"' -f4)
            if [ -z "$GMTS" ]; then
              echo "::warning::gmTs를 감지할 수 없습니다. 스킵합니다."
              echo "value=" >> $GITHUB_OUTPUT
            else
              echo "value=$GMTS" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Fetch results & settle
        if: steps.gmts.outputs.value != ''
        env:
          NEXT_PUBLIC_APP_URL: ${{ secrets.PRODUCTION_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "회차: ${{ steps.gmts.outputs.value }}"
          pnpm exec tsx scripts/betman-fetch-results.ts ${{ steps.gmts.outputs.value }}

      - name: Summary
        if: steps.gmts.outputs.value != ''
        run: |
          echo "## Betman 결과 수집 & 정산 완료" >> $GITHUB_STEP_SUMMARY
          echo "- 회차: ${{ steps.gmts.outputs.value }}" >> $GITHUB_STEP_SUMMARY
          echo "- 시간: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S KST')" >> $GITHUB_STEP_SUMMARY
          echo "- 결과 수집 → 자동 정산 → 통계 갱신까지 완료" >> $GITHUB_STEP_SUMMARY
