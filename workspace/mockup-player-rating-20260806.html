<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>선수 평점 — 팰리스 2:2 아스날</title>
<style>
  /* gongnori.fan 실제 디자인 토큰 (app/globals.css) */
  :root{
    --background:#faf9f7; --card:#ffffff; --foreground:#111111;
    --primary:#961e37; --primary-fg:#ffffff;
    --muted:#f2efea; --muted-fg:#5c6470; --border:#e8e5e0; --radius:8px;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{font-family:"Pretendard","Apple SD Gothic Neo",system-ui,sans-serif; background:var(--background); color:var(--foreground); padding:16px 12px 80px; -webkit-tap-highlight-color:transparent}
  .wrap{max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:10px}

  .card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px}

  .head h1{font-size:18px; font-weight:700}
  .head .match{font-size:13px; color:var(--muted-fg); margin-top:4px}
  .head .chips{display:flex; gap:6px; margin-top:10px}
  .chip{font-size:11px; font-weight:600; background:var(--muted); color:var(--muted-fg); border-radius:999px; padding:3px 10px}

  .q .name{font-size:15px; font-weight:600; display:flex; align-items:baseline; gap:8px}
  .q .meta{font-size:12px; color:var(--muted-fg); font-weight:400}

  .scale{display:flex; gap:4px; margin-top:12px}
  .opt{flex:1; height:36px; border:1px solid var(--border); border-radius:var(--radius); background:var(--card);
       font-size:13px; font-weight:600; color:var(--muted-fg); display:flex; align-items:center; justify-content:center; cursor:pointer;
       transition:background .1s, color .1s}
  .opt:hover{background:var(--muted)}
  .opt.sel{background:var(--primary); border-color:var(--primary); color:var(--primary-fg)}
  .ends{display:flex; justify-content:space-between; font-size:11px; color:var(--muted-fg); margin-top:6px}

  .submit{position:sticky; bottom:12px; display:flex; align-items:center; justify-content:space-between; gap:12px;
          background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:12px 16px;
          box-shadow:0 4px 16px rgba(17,17,17,.06)}
  .count{font-size:12px; color:var(--muted-fg)}
  .btn{background:var(--primary); color:var(--primary-fg); border:none; border-radius:var(--radius);
       font-size:14px; font-weight:700; padding:10px 24px; cursor:pointer}
  .btn:disabled{opacity:.4; cursor:default}
</style>
</head>
<body>
<div class="wrap">

  <div class="card head">
    <h1>선수 평점</h1>
    <div class="match">크리스탈 팰리스 2 : 2 아스날 · 프리미어리그 1R</div>
    <div class="chips"><span class="chip">경기 종료</span><span class="chip">출전 선수만</span><span class="chip">선수당 1회</span></div>
  </div>

  <div class="card q" data-p><div class="name">부카요 사카 <span class="meta">RW · 90′ · 1골 1도움</span></div></div>
  <div class="card q" data-p><div class="name">다비드 라야 <span class="meta">GK · 90′ · 실점 2</span></div></div>
  <div class="card q" data-p><div class="name">가브리엘 마르티넬리 <span class="meta">LW · 84′ · 1골</span></div></div>
  <div class="card q" data-p><div class="name">데클란 라이스 <span class="meta">DM · 90′</span></div></div>
  <div class="card q" data-p><div class="name">마르틴 외데고르 <span class="meta">AM · 90′ · 1도움</span></div></div>
  <div class="card q" data-p><div class="name">가브리엘 마갈량이스 <span class="meta">CB · 90′</span></div></div>
  <div class="card q" data-p><div class="name">윌리암 살리바 <span class="meta">CB · 90′</span></div></div>
  <div class="card q" data-p><div class="name">맥스 도우먼 <span class="meta">교체 IN 71′</span></div></div>

  <div class="submit">
    <span class="count" id="c">0 / 8 평가함</span>
    <button class="btn" id="s" disabled>제출</button>
  </div>

</div>

<script>
  const qs = document.querySelectorAll('[data-p]');
  const counter = document.getElementById('c');
  const submit = document.getElementById('s');
  const done = new Set();
  qs.forEach((q, qi) => {
    const scale = document.createElement('div'); scale.className = 'scale';
    for (let n = 1; n <= 10; n++) {
      const o = document.createElement('button'); o.className = 'opt'; o.textContent = n;
      o.onclick = () => {
        scale.querySelectorAll('.opt').forEach(x => x.classList.remove('sel'));
        o.classList.add('sel');
        done.add(qi);
        counter.textContent = `${done.size} / ${qs.length} 평가함`;
        submit.disabled = done.size === 0;
      };
      scale.appendChild(o);
    }
    const ends = document.createElement('div'); ends.className = 'ends';
    ends.innerHTML = '<span>아쉬움</span><span>최고</span>';
    q.appendChild(scale); q.appendChild(ends);
  });
</script>
</body>
</html>
