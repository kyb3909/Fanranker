<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>RONDO — 패스 서바이벌</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; background:#06080f; overflow:hidden;
    font-family:'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;
    -webkit-user-select:none; user-select:none; touch-action:none; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; background:#06080f; cursor:crosshair; }
  .overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; z-index:10; }
  .hidden { display:none !important; }
  .panel { background:rgba(10,14,26,.92); border:1px solid rgba(255,255,255,.09);
    border-radius:18px; padding:26px 30px; text-align:center; color:#dfe7f5;
    box-shadow:0 18px 60px rgba(0,0,0,.6), 0 0 0 1px rgba(255,213,74,.06) inset;
    backdrop-filter:blur(6px); max-width:520px; width:min(92%,520px); }
  .logo { font-size:46px; font-weight:900; letter-spacing:10px; color:#ffd54a;
    text-shadow:0 0 26px rgba(255,213,74,.45), 0 3px 0 rgba(0,0,0,.5); }
  .logo small { display:block; font-size:14px; letter-spacing:4px; color:#8fd3ff; margin-top:6px;
    text-shadow:0 0 14px rgba(143,211,255,.5); }
  .sub { margin-top:10px; font-size:13px; color:#aeb9cf; line-height:1.7; }
  .howto { margin:16px auto 4px; font-size:13.5px; color:#cfdceb; line-height:2.0; text-align:left;
    display:inline-block; }
  .howto b { color:#ffd54a; }
  .howto .k { display:inline-block; background:#1b2336; border:1px solid rgba(255,255,255,.14);
    border-radius:6px; padding:1px 8px; font-size:12px; margin-right:7px; color:#fff; }
  .btn { margin-top:18px; display:inline-block; background:linear-gradient(180deg,#ffd54a,#f0a92c);
    color:#3a2a05; border:none; border-radius:12px; font-size:18px; font-weight:900;
    padding:13px 42px; cursor:pointer; letter-spacing:1px;
    box-shadow:0 6px 0 #9c6a14, 0 10px 26px rgba(240,169,44,.35); }
  .btn:active { transform:translateY(4px); box-shadow:0 2px 0 #9c6a14; }
  .btn.lock { filter:grayscale(.7) brightness(.7); pointer-events:none; }
  .reason { font-size:15px; font-weight:800; letter-spacing:1px; margin-bottom:4px; }
  .bigscore { font-size:44px; font-weight:900; color:#fff; text-shadow:0 0 22px rgba(255,213,74,.35); }
  .bigscore small { font-size:15px; color:#ffd54a; }
  .rows { display:flex; gap:10px; justify-content:center; margin:14px 0 4px; flex-wrap:wrap; }
  .rows div { background:#121a2c; border:1px solid rgba(255,255,255,.08); border-radius:10px;
    padding:8px 14px; font-size:12.5px; color:#9fb0ca; }
  .rows b { display:block; font-size:17px; color:#fff; margin-top:2px; }
  .iconbtn { position:absolute; top:12px; z-index:20; width:42px; height:42px; border-radius:12px;
    background:rgba(13,18,32,.8); border:1px solid rgba(255,255,255,.12); color:#dfe7f5;
    font-size:18px; cursor:pointer; }
  #muteBtn { right:12px; }
  #pauseBtn { left:12px; }
  .flash { animation:fl .9s infinite; }
  @keyframes fl { 0%,100%{opacity:1} 50%{opacity:.35} }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="800" height="800"></canvas>

  <button id="pauseBtn" class="iconbtn hidden">⏸</button>
  <button id="muteBtn" class="iconbtn">🔊</button>

  <div id="menu" class="overlay">
    <div class="panel">
      <div class="logo">RONDO<small>패스 서바이벌</small></div>
      <div class="sub">수비는 공을 쫓는다 — 패스가 곧 생존이다.<br>한 번의 실수면 끝나는 론도 스코어 어택.</div>
      <div class="howto">
        <div><span class="k">마우스</span><b>조준</b> — 가장 가까운 동료에 자동 타겟</div>
        <div><span class="k">꾹</span><b>차징</b> — 길수록 강한 패스 (초록 존이 적정)</div>
        <div><span class="k">놓기</span><b>패스</b> — 도착 후 0.35초 내 원터치 = 배수 ↑</div>
        <div><span class="k">A·D / ←→</span><b>이동</b> — 원을 따라 좌우, 받을 사람도 미리 이동</div>
      </div>
      <br><button id="startBtn" class="btn">킥오프 ⚽</button>
      <div class="sub" style="margin-top:12px">세션 베스트 <b id="menuBest" style="color:#ffd54a">0</b></div>
    </div>
  </div>

  <div id="over" class="overlay hidden">
    <div class="panel">
      <div id="reasonEl" class="reason">인터셉트</div>
      <div class="bigscore"><span id="finalScore">0</span><small> 점</small></div>
      <div id="overComment" class="sub"></div>
      <div class="rows">
        <div>패스<b id="rPass">0</b></div>
        <div>최대 배수<b id="rMult">×1.0</b></div>
        <div>웨이브<b id="rWave">1</b></div>
        <div>알까기<b id="rNut">0</b></div>
        <div>베스트<b id="rBest">0</b></div>
      </div>
      <button id="retryBtn" class="btn lock">다시 킥오프</button>
    </div>
  </div>

  <div id="pauseOv" class="overlay hidden">
    <div class="panel"><div class="logo" style="font-size:30px">PAUSE</div>
    <div class="sub">⏸ 버튼 또는 P 키로 재개</div></div>
  </div>
</div>

<script>
'use strict';
// ====================================================================
// RONDO — 패스 서바이벌  (Corner Hero 룩앤필 / 바닐라 Canvas 2D 단일 파일)
// ====================================================================

// ---------- CFG: 전체 밸런스 수치 (PRD §14) ----------
const CFG = {
  R0:280, R_MIN:190, SHRINK:0.96,
  DEF_SPEED:200, DEF_WAVE_MULT:1.06,
  LUNGE_SPEED:450, LUNGE_DUR:0.25, LUNGE_DELAY:0.18, LUNGE_TRIGGER:110,
  LUNGE_CD:1.2, LUNGE_CD_WAVE:0.92, RECOVER:0.8,
  STEAL_R:36, STEAL_T:0.25,
  BALL_MIN:420, BALL_MAX:880, CHARGE_T:0.5, TOL:0.20,
  ONETOUCH:0.35, HOLD_DECAY_AT:1.2, MULT_MAX:5.0,
  INTERCEPT_R:18, NUTMEG_R:22, SAFE_DIST:28, LINEBREAK_R:80,
  WAVE_EVERY:12, TILT_EVERY:15, TILT_DUR:8, TILT_SPEED:1.10, TILT_TRIGGER:1.30,
  STUN:1.5, ARRIVE_R:15, OUT_PAD:60,
  MOVE_SPEED:150, GAP_MIN:0.5, AI_MOVE:95, HOMING:1.8, FLY_MAX:3.0,
};

// ---------- 유틸 ----------
const TAU = Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const hyp=(x,y)=>Math.sqrt(x*x+y*y);
const rand=(a,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
function rr(x,y,w,h,r){ g.beginPath(); g.roundRect(x,y,w,h,r); }
function txt(s,x,y,size,color,align,weight){
  g.font=(weight||700)+' '+size+'px "Apple SD Gothic Neo","Noto Sans KR",sans-serif';
  g.fillStyle=color||'#fff'; g.textAlign=align||'center'; g.textBaseline='middle';
  g.fillText(s,x,y);
}
// 선분 위 최근접점
function closestOnSeg(px,py,ax,ay,bx,by){
  const dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy||1;
  const t=clamp(((px-ax)*dx+(py-ay)*dy)/L2,0,1);
  return {x:ax+dx*t, y:ay+dy*t, t:t};
}

// ---------- 캔버스 / FIT 스케일 ----------
const cv=document.getElementById('cv'), g=cv.getContext('2d');
const W=800, H=800, CX=400, CY=400;
function fit(){
  const vw=window.innerWidth, vh=window.innerHeight;
  const s=Math.min(vw/W, vh/H);
  cv.style.width=(W*s)+'px'; cv.style.height=(H*s)+'px';
}
window.addEventListener('resize',fit); fit();

// ---------- 오디오 (WebAudio 합성 — Corner Hero 엔진) ----------
let ac=null, masterGain=null, muted=false, crowdGain=null;
function initAudio(){
  if(ac) return;
  try{
    ac=new (window.AudioContext||window.webkitAudioContext)();
    masterGain=ac.createGain(); masterGain.gain.value=muted?0:.8;
    masterGain.connect(ac.destination);
    // 관중 웅성거림 루프
    const len=2*ac.sampleRate;
    const buf=ac.createBuffer(1,len,ac.sampleRate);
    const ch=buf.getChannelData(0);
    let v=0;
    for(let i=0;i<len;i++){ v=v*.985+(Math.random()*2-1)*.05; ch[i]=v; }
    const src=ac.createBufferSource(); src.buffer=buf; src.loop=true;
    const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=420;
    crowdGain=ac.createGain(); crowdGain.gain.value=.14;
    src.connect(f); f.connect(crowdGain); crowdGain.connect(masterGain);
    src.start();
  }catch(e){ ac=null; }
}
function tone(freq,dur,type,vol,slide,delay){
  if(!ac) return;
  const t0=ac.currentTime+(delay||0);
  const o=ac.createOscillator(), gn=ac.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(freq,t0);
  if(slide) o.frequency.linearRampToValueAtTime(Math.max(40,freq+slide),t0+dur);
  gn.gain.setValueAtTime(vol||.15,t0);
  gn.gain.exponentialRampToValueAtTime(.001,t0+dur);
  o.connect(gn); gn.connect(masterGain);
  o.start(t0); o.stop(t0+dur+.02);
}
function noiseBurst(dur,vol,fc,q){
  if(!ac) return;
  const t0=ac.currentTime;
  const len=Math.max(1,Math.floor(dur*ac.sampleRate));
  const buf=ac.createBuffer(1,len,ac.sampleRate);
  const ch=buf.getChannelData(0);
  for(let i=0;i<len;i++) ch[i]=(Math.random()*2-1)*(1-i/len);
  const src=ac.createBufferSource(); src.buffer=buf;
  const f=ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=fc||1200; f.Q.value=q||1;
  const gn=ac.createGain(); gn.gain.setValueAtTime(vol||.2,t0);
  gn.gain.exponentialRampToValueAtTime(.001,t0+dur);
  src.connect(f); f.connect(gn); gn.connect(masterGain);
  src.start(t0);
}
function crowdHype(amt){
  if(!ac||!crowdGain) return;
  const t0=ac.currentTime;
  crowdGain.gain.cancelScheduledValues(t0);
  crowdGain.gain.setValueAtTime(.14+amt,t0);
  crowdGain.gain.exponentialRampToValueAtTime(.14,t0+1.6);
}
const sfx={
  pass(p){ tone(440*(1+p*.1),.07,'square',.13); noiseBurst(.07,.12,2200,2); },
  arrive(){ tone(660,.07,'square',.13); },
  onetouch(m){ tone(880+60*m,.09,'square',.15); tone(1320+60*m,.07,'sine',.1,0,.05); },
  nutmeg(){ tone(660,.09,'square',.18); tone(990,.09,'square',.16,0,.08); tone(1320,.12,'square',.15,0,.16); crowdHype(.3); },
  linebreak(){ tone(740,.08,'square',.15); tone(1110,.1,'square',.13,0,.06); },
  wave(){ tone(520,.1,'square',.15); tone(780,.13,'square',.15,0,.1); },
  tilt(){ tone(180,.3,'sawtooth',.16,-60); },
  stealTick(){ tone(160,.05,'square',.12); },
  death(){ tone(520,.14,'square',.18,-80); tone(380,.16,'square',.16,-80,.12); tone(240,.3,'square',.16,-100,.26);
    noiseBurst(.5,.22,900,1); crowdHype(-.06); },
  whistle(){ tone(2350,.5,'square',.12,30); },
  charge(){ tone(330,.05,'triangle',.06); },
};

// ---------- 이펙트 (파티클 / 플로터 / 셰이크) ----------
let parts=[], floats=[], shakeT=0, shakeAmp=0, flashT=0;
function spark(x,y,n,col){
  for(let i=0;i<(n||6);i++){
    const a=rand(TAU), sp=rand(60,220);
    parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rand(.3,.6),t:0,r:rand(2,4),col:col||'#ffd54a'});
  }
}
function dust(x,y,n){
  for(let i=0;i<(n||5);i++){
    const a=rand(TAU), sp=rand(20,80);
    parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-30,life:rand(.25,.5),t:0,r:rand(2,5),col:'rgba(190,210,190,.5)'});
  }
}
function floater(s,x,y,o){
  o=o||{};
  floats.push({s:s,x:x,y:y,t:0,life:o.life||.9,vy:o.vy||-46,size:o.size||16,color:o.color||'#fff',w:o.weight||900});
}
function shake(amp,dur){ shakeAmp=Math.max(shakeAmp,amp); shakeT=Math.max(shakeT,dur); }
function updateFx(dt){
  for(const p of parts){ p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=160*dt; }
  parts=parts.filter(p=>p.t<p.life);
  for(const f of floats){ f.t+=dt; f.y+=f.vy*dt; }
  floats=floats.filter(f=>f.t<f.life);
  shakeT=Math.max(0,shakeT-dt); if(shakeT<=0) shakeAmp=0;
  flashT=Math.max(0,flashT-dt);
}
function drawFx(){
  for(const p of parts){
    g.globalAlpha=clamp(1-p.t/p.life,0,1);
    g.fillStyle=p.col; g.beginPath(); g.arc(p.x,p.y,p.r,0,TAU); g.fill();
  }
  g.globalAlpha=1;
  for(const f of floats){
    g.globalAlpha=clamp(1-(f.t/f.life)*(f.t/f.life),0,1);
    g.font=f.w+' '+f.size+'px "Apple SD Gothic Neo","Noto Sans KR",sans-serif';
    g.textAlign='center'; g.textBaseline='middle';
    g.lineWidth=4; g.strokeStyle='rgba(0,0,0,.55)'; g.strokeText(f.s,f.x,f.y);
    g.fillStyle=f.color; g.fillText(f.s,f.x,f.y);
  }
  g.globalAlpha=1;
}

// ---------- 캐릭터 드로잉 (Corner Hero drawDude 탑다운 적용판) ----------
function drawGuy(x,y,o){
  const d={h:30, jersey:'#e8232e', jersey2:null, sleeve:'#f5f7fa', shorts:'#f5f7fa',
    skin:'#f1c69b', hair:'#23242a', face:1, run:0, alpha:1, lean:0, leanDir:1, dark:0, xmark:false, blink:false};
  for(const k in o) d[k]=o[k];
  const u=d.h/9;
  g.save(); g.globalAlpha=d.alpha;
  // 그림자
  g.fillStyle='rgba(0,0,0,.32)';
  g.beginPath(); g.ellipse(x,y+u*.6, 2.3*u, .9*u, 0,0,TAU); g.fill();
  const fy=y;
  if(d.lean>0){
    g.translate(x,fy-3.2*u); g.rotate(d.leanDir*Math.min(1,d.lean)*1.0); g.translate(-x,-(fy-3.2*u));
  }
  g.lineCap='round';
  // 다리
  const hipY=fy-3.3*u;
  for(const s of [-1,1]){
    const swing=Math.sin(d.run+(s>0?0:Math.PI));
    const hx=x+s*.62*u;
    const kx=hx+swing*1.0*u, ky=fy-1.7*u;
    const fx2=hx+swing*1.7*u, fy2=fy-Math.max(0,swing)*.35*u;
    g.strokeStyle=d.shorts; g.lineWidth=1.05*u;
    g.beginPath(); g.moveTo(hx,hipY); g.lineTo(kx,ky); g.stroke();
    g.strokeStyle=d.skin; g.lineWidth=.92*u;
    g.beginPath(); g.moveTo(kx,ky); g.lineTo(fx2,fy2); g.stroke();
    g.fillStyle='#15181d';
    g.beginPath(); g.arc(fx2,fy2,.55*u,0,TAU); g.fill();
  }
  // 몸통
  g.fillStyle=d.blink?'#ffffff':d.jersey;
  rr(x-1.75*u, fy-6.7*u, 3.5*u, 3.7*u, 1.2*u); g.fill();
  if(d.jersey2 && !d.blink){
    g.fillStyle=d.jersey2; g.globalAlpha=d.alpha*.9;
    rr(x-1.75*u, fy-5.15*u, 3.5*u, .55*u, .25*u); g.fill();
    g.globalAlpha=d.alpha;
  }
  // 팔
  for(const s of [-1,1]){
    const sx2=x+s*1.55*u, sy2=fy-6.0*u;
    const swA=Math.sin(d.run+(s>0?Math.PI:0))*.9;
    const ex=sx2+s*.3*u+swA*.9*u, ey=sy2+2.2*u;
    g.strokeStyle=d.blink?'#ffffff':(d.sleeve||d.jersey); g.lineWidth=.85*u;
    g.beginPath(); g.moveTo(sx2,sy2); g.lineTo(ex,ey); g.stroke();
    g.fillStyle=d.skin; g.beginPath(); g.arc(ex,ey,.45*u,0,TAU); g.fill();
  }
  // 머리
  const hy2=fy-8.0*u;
  g.fillStyle=d.skin; g.beginPath(); g.arc(x,hy2,1.35*u,0,TAU); g.fill();
  g.fillStyle=d.blink?'#fff':d.hair;
  g.beginPath(); g.arc(x,hy2-.22*u,1.35*u,Math.PI,TAU); g.fill();
  g.fillStyle='#1b1d22';
  g.beginPath(); g.arc(x+d.face*.55*u,hy2+.12*u,.17*u,0,TAU); g.fill();
  // 어두움(경직/기절) + X 마크
  if(d.dark>0){
    g.globalAlpha=d.alpha*d.dark*.45; g.fillStyle='#000';
    rr(x-2.2*u, fy-9.4*u, 4.4*u, 9.8*u, 2*u); g.fill();
    g.globalAlpha=d.alpha;
  }
  if(d.xmark){
    g.strokeStyle='#ffe14d'; g.lineWidth=2.4; g.lineCap='round';
    const mx=x, my=fy-10.6*u, r=4.5;
    g.beginPath(); g.moveTo(mx-r,my-r); g.lineTo(mx+r,my+r);
    g.moveTo(mx+r,my-r); g.lineTo(mx-r,my+r); g.stroke();
  }
  g.restore();
}

// ---------- 공 ----------
function drawBallAt(x,y,r,rot){
  g.save(); g.translate(x,y); g.rotate(rot||0);
  g.fillStyle='#fff'; g.beginPath(); g.arc(0,0,r,0,TAU); g.fill();
  g.strokeStyle='rgba(0,0,0,.25)'; g.lineWidth=Math.max(1,r*.12); g.stroke();
  g.fillStyle='#2b3340';
  g.beginPath(); g.arc(0,0,r*.32,0,TAU); g.fill();
  for(let i=0;i<5;i++){
    const a=i/5*TAU;
    g.beginPath(); g.arc(Math.cos(a)*r*.74,Math.sin(a)*r*.74,r*.2,0,TAU); g.fill();
  }
  g.fillStyle='rgba(255,255,255,.65)';
  g.beginPath(); g.arc(-r*.34,-r*.4,r*.2,0,TAU); g.fill();
  g.restore();
}

// ---------- 필드 (야간 경기장) ----------
function drawField(R){
  // 바깥 어둠 + 플러드라이트
  g.fillStyle='#06080f'; g.fillRect(0,0,W,H);
  for(const c of [[60,60],[740,60],[60,740],[740,740]]){
    const gr=g.createRadialGradient(c[0],c[1],0,c[0],c[1],340);
    gr.addColorStop(0,'rgba(190,215,255,.10)'); gr.addColorStop(1,'rgba(190,215,255,0)');
    g.fillStyle=gr; g.fillRect(0,0,W,H);
  }
  // 관중 보케 링 (필드 바깥 랜덤 점 — 고정 시드 패턴)
  g.save();
  for(let i=0;i<90;i++){
    const a=(i*2.399963)%TAU;                  // 골든앵글 분산
    const rr2=R+70+((i*53)%120);
    if(rr2>540) continue;
    const x=CX+Math.cos(a)*rr2, y=CY+Math.sin(a)*rr2;
    g.fillStyle=['#3a4a6a','#54402e','#2e4a3a','#5a3a52'][i%4];
    g.globalAlpha=.5+((i*29)%40)/100;
    g.beginPath(); g.arc(x,y,3.2,0,TAU); g.fill();
  }
  g.restore(); g.globalAlpha=1;
  // 잔디 원 — 동심원 잔디결
  g.save();
  g.beginPath(); g.arc(CX,CY,R+34,0,TAU); g.clip();
  g.fillStyle='#123d20'; g.fillRect(CX-R-40,CY-R-40,(R+40)*2,(R+40)*2);
  for(let i=0;i<8;i++){
    const r0=(R+34)*(1-i/8), r1=(R+34)*(1-(i+1)/8);
    g.fillStyle=i%2?'#15532b':'#114724';
    g.beginPath(); g.arc(CX,CY,r0,0,TAU); g.arc(CX,CY,r1,0,TAU,true); g.fill();
  }
  // 조명 그라데이션
  const lg=g.createRadialGradient(CX,CY-80,60,CX,CY,R+60);
  lg.addColorStop(0,'rgba(255,255,230,.10)'); lg.addColorStop(1,'rgba(0,0,20,.18)');
  g.fillStyle=lg; g.fillRect(CX-R-40,CY-R-40,(R+40)*2,(R+40)*2);
  g.restore();
  // 경계선 + 센터 스팟
  g.strokeStyle='rgba(235,245,255,.85)'; g.lineWidth=3;
  g.beginPath(); g.arc(CX,CY,R,0,TAU); g.stroke();
  g.strokeStyle='rgba(235,245,255,.18)'; g.lineWidth=8;
  g.beginPath(); g.arc(CX,CY,R+8,0,TAU); g.stroke();
  g.fillStyle='rgba(235,245,255,.5)';
  g.beginPath(); g.arc(CX,CY,4,0,TAU); g.fill();
}

const app={ screen:'title', best:0, bestPass:0 };
let G=null, paused=false, muted2=false;

const ATK_KIT={ jersey:'#e8232e', jersey2:null, sleeve:'#f5f7fa', shorts:'#f5f7fa' };
const DEF_KIT={ jersey:'#5b8df0', jersey2:'#ffffff', sleeve:null, shorts:'#16335f' };
const HAIRS=['#23242a','#5a3b22','#1c1c22','#efefef','#7a4a2a','#3a3a44'];

function newGame(){
  const atks=[];
  for(let i=0;i<6;i++){
    const a0=-Math.PI/2+i*(TAU/6);
    atks.push({ang:a0, homeAng:a0, hair:HAIRS[i], run:rand(TAU), face:1});
  }
  const defs=[];
  for(let i=0;i<3;i++){
    const a=-Math.PI/2+i*(TAU/3)+rand(-.25,.25);
    defs.push({ x:CX+Math.cos(a)*rand(60,84), y:CY+Math.sin(a)*rand(60,84),
      state:'MOVE', stateT:0, cd:0, role:'PRESSER', tgtX:CX, tgtY:CY,
      lungeX:0, lungeY:0, stealT:0, run:rand(TAU), face:1, hair:'#1a1c22' });
  }
  G={
    R:CFG.R0, Rtarget:CFG.R0, Ranim:0,
    atks:atks, defs:defs,
    carrier:0, ball:{ x:0,y:0, vx:0,vy:0, flying:false, toIdx:-1, sx:0,sy:0, rot:0, nutSet:new Set(), lineN:0, missFlag:false, req:0, spd:0, flyT:0 },
    holdT:0, firstPass:false, arriveAt:-99,
    charging:false, chargeT:0, pendingPress:false,
    score:0, mult:1, maxMult:1, pass:0, wave:1, nutmegs:0,
    tiltT:0, time:0, hintT:12,
    defSpdMult:1, cdMult:1,
    over:false, reason:'', overT:0,
  };
  const c=atkPos(0);
  G.ball.x=c.x; G.ball.y=c.y;
  assignRoles();
}
function atkPos(i){
  const a=G.atks[i];
  return { x:CX+Math.cos(a.ang)*G.R, y:CY+Math.sin(a.ang)*G.R };
}
function atkPosAt(ang){
  return { x:CX+Math.cos(ang)*G.R, y:CY+Math.sin(ang)*G.R };
}
function diffSpeed(){ return CFG.DEF_SPEED*G.defSpdMult*(G.tiltT>0?CFG.TILT_SPEED:1); }

// ---------- 역할 배정 (공 도착 시마다) ----------
function assignRoles(){
  const c=atkPos(G.carrier);
  // 최근접 = 프레서
  let pi=0, pd=1e9;
  for(let i=0;i<3;i++){
    const d=hyp(G.defs[i].x-c.x,G.defs[i].y-c.y);
    if(d<pd){ pd=d; pi=i; }
  }
  const cutters=[0,1,2].filter(i=>i!==pi);
  // 좌/우 인접 동료 라인 60% 지점
  const li=(G.carrier+5)%6, ri=(G.carrier+1)%6;
  const lp=atkPos(li), rp=atkPos(ri);
  const L={x:lerp(c.x,lp.x,.6), y:lerp(c.y,lp.y,.6)};
  const Rt={x:lerp(c.x,rp.x,.6), y:lerp(c.y,rp.y,.6)};
  // 이동 총거리 최소 배정 (교차 방지)
  const a=G.defs[cutters[0]], b=G.defs[cutters[1]];
  const d1=hyp(a.x-L.x,a.y-L.y)+hyp(b.x-Rt.x,b.y-Rt.y);
  const d2=hyp(a.x-Rt.x,a.y-Rt.y)+hyp(b.x-L.x,b.y-L.y);
  G.defs[pi].role='PRESSER';
  if(d1<=d2){ a.role='CUT_L'; b.role='CUT_R'; } else { a.role='CUT_R'; b.role='CUT_L'; }
}

// ---------- 조준 (스냅 타겟팅) ----------
let pointer={x:CX,y:CY-200,down:false};
const keys=new Set();
function snapTarget(){
  const ci=G.ball.flying?G.ball.toIdx:G.carrier;
  const c=atkPos(ci);
  const pa=Math.atan2(pointer.y-c.y,pointer.x-c.x);
  let best=-1, bd=1e9;
  for(let i=0;i<6;i++){
    if(i===ci) continue;
    const p=atkPos(i);
    const a=Math.atan2(p.y-c.y,p.x-c.x);
    let d=Math.abs(a-pa); if(d>Math.PI) d=TAU-d;
    if(d<bd){ bd=d; best=i; }
  }
  return best;
}
function reqSpeedFor(d){ return clamp(440+(d-260)*1.2,430,820); }

// ---------- 패스 ----------
function releasePass(){
  const ci=G.carrier, ti=snapTarget();
  const c=atkPos(ci), t=atkPos(ti);
  const d=hyp(t.x-c.x,t.y-c.y);
  const charge=clamp(G.chargeT/CFG.CHARGE_T,0,1);
  const spd=lerp(CFG.BALL_MIN,CFG.BALL_MAX,charge);
  const req=reqSpeedFor(d);
  const b=G.ball;
  b.flying=true; b.toIdx=ti; b.sx=c.x; b.sy=c.y;
  const dx=(t.x-c.x)/d, dy=(t.y-c.y)/d;
  b.vx=dx*spd; b.vy=dy*spd;
  b.x=c.x; b.y=c.y;
  b.missFlag = spd > (1+CFG.TOL)*req;
  b.req=req; b.spd=spd;
  b.nutSet=new Set(); b.flyT=0;
  // 라인 브레이킹 카운트 (릴리즈 시점 경로 80px 내 수비 수)
  b.lineN=0;
  for(const df of G.defs){
    const cp=closestOnSeg(df.x,df.y,c.x,c.y,t.x,t.y);
    if(hyp(df.x-cp.x,df.y-cp.y)<=CFG.LINEBREAK_R) b.lineN++;
  }
  // 원터치 보너스 (도착 후 0.35초 내 릴리즈)
  if(G.firstPass && (G.time-G.arriveAt)<=CFG.ONETOUCH){
    G.mult=Math.min(CFG.MULT_MAX,G.mult+.5);
    G.maxMult=Math.max(G.maxMult,G.mult);
    sfx.onetouch(G.mult);
    floater('원터치! ×'+G.mult.toFixed(1), c.x, c.y-44, {color:'#8fd3ff',size:15});
  }
  G.firstPass=true;
  G.charging=false; G.chargeT=0; G.holdT=0;
  // 런지 트리거 평가 (릴리즈 감지)
  const trig=CFG.LUNGE_TRIGGER*(G.tiltT>0?CFG.TILT_TRIGGER:1);
  for(const df of G.defs){
    if(df.state!=='MOVE'||df.cd>0) continue;
    const cp=closestOnSeg(df.x,df.y,c.x,c.y,t.x,t.y);
    if(hyp(df.x-cp.x,df.y-cp.y)<=trig){
      df.state='DELAY'; df.stateT=0; df.lungeX=cp.x; df.lungeY=cp.y;
    }
  }
  // 조작권 즉시 리시버로
  G.carrier=ti;
  sfx.pass(charge);
}

// ---------- 도착 / 점수 ----------
function arriveBall(){
  const b=G.ball;
  b.flying=false;
  const p=atkPos(b.toIdx);
  b.x=p.x; b.y=p.y;
  G.arriveAt=G.time;
  G.holdT=0;
  G.pass++;
  // 점수
  let pts=Math.round(10*G.mult);
  G.score+=pts;
  floater('+'+pts+(G.mult>1?' ×'+G.mult.toFixed(1):''), p.x, p.y-40, {color:'#fff',size:15});
  if(b.lineN>=2){
    G.score+=30;
    floater('라인 브레이킹! +30', p.x, p.y-62, {color:'#6cffb0',size:15});
    sfx.linebreak();
  }
  sfx.arrive();
  // 선차징: 도착 순간 버튼이 눌려 있으면 차징 시작
  if(pointer.down){ G.charging=true; G.chargeT=0; }
  // 웨이브 / 틸트
  if(G.pass%CFG.WAVE_EVERY===0){
    G.wave++;
    G.defSpdMult*=CFG.DEF_WAVE_MULT;
    G.cdMult*=CFG.LUNGE_CD_WAVE;
    G.Rtarget=Math.max(CFG.R_MIN,G.Rtarget*CFG.SHRINK);
    G.Ranim=.8;
    floater('WAVE '+G.wave, CX, CY-60, {color:'#ffd54a',size:26,life:1.3});
    sfx.wave(); crowdHype(.18);
  }
  if(G.pass%CFG.TILT_EVERY===0){
    G.tiltT=CFG.TILT_DUR;
    floater('수비 빡침!', CX, CY-100, {color:'#ff8a2a',size:20,life:1.3});
    sfx.tilt();
  }
  assignRoles();
}

// ---------- 런 종료 ----------
function gameOver(reason){
  if(G.over) return;
  G.over=true; G.reason=reason; G.overT=0;
  app.best=Math.max(app.best,G.score);
  app.bestPass=Math.max(app.bestPass,G.pass);
  sfx.death(); sfx.whistle(); shake(10,.5);
  // 부모 페이지(앱) 리더보드용 점수 전송 — iframe 밖에서 열면 무시됨
  try{ if(window.parent!==window) window.parent.postMessage({type:'minigame:score',game:'rondo',score:Math.round(G.score)},window.location.origin); }catch(e){}
  setTimeout(showOver,650);
}

// ---------- 업데이트 ----------
function update(dt){
  if(!G||G.over){ if(G) G.overT+=dt; updateFx(dt); return; }
  G.time+=dt;
  G.hintT=Math.max(0,G.hintT-dt);
  G.tiltT=Math.max(0,G.tiltT-dt);
  // 필드 축소 애니
  if(G.Ranim>0){
    G.Ranim=Math.max(0,G.Ranim-dt);
    G.R=lerp(G.Rtarget,G.R,G.Ranim/.8);
  } else G.R=G.Rtarget;

  const b=G.ball;
  // 좌우(원호) 이동 — 조작권 선수는 수동(자리 유지), 동료 5명은 공간 탐색 AI
  {
    const ci2=b.flying?b.toIdx:G.carrier;
    const holder=atkPos(ci2);
    // 이웃 간 최소 간격 클램프 (대형 붕괴 방지)
    const gapClamp=(i,na)=>{
      let lo=G.atks[(i+5)%6].ang, hi=G.atks[(i+1)%6].ang;
      if(i===0) lo-=TAU;
      if(i===5) hi+=TAU;
      return clamp(na, lo+CFG.GAP_MIN, hi-CFG.GAP_MIN);
    };
    const ak=G.atks[ci2];
    let mdir=0;
    if(keys.has('KeyA')||keys.has('ArrowLeft')) mdir-=1;
    if(keys.has('KeyD')||keys.has('ArrowRight')) mdir+=1;
    if(mdir!==0){
      ak.ang=gapClamp(ci2, ak.ang+mdir*(CFG.MOVE_SPEED/G.R)*dt);
      ak.run+=dt*6; ak.face=mdir>0?1:-1;
    }
    // 동료 AI: 보유자→나 패스 라인이 가장 열리는 방향으로 이동
    const laneClear=(tx,ty)=>{
      let mn=1e9;
      for(const df of G.defs){
        if(df.state==='RECOVER'||df.state==='STUN') continue;
        const cp=closestOnSeg(df.x,df.y,holder.x,holder.y,tx,ty);
        mn=Math.min(mn,hyp(df.x-cp.x,df.y-cp.y));
      }
      return Math.min(mn,130);
    };
    for(let i=0;i<6;i++){
      if(i===ci2) continue;
      const o=G.atks[i], step=0.085;
      const p0=atkPosAt(o.ang), pL=atkPosAt(o.ang-step), pR=atkPosAt(o.ang+step);
      const s0=laneClear(p0.x,p0.y)+4;   // 현 위치 고수 보너스 (떨림 방지)
      const sL=laneClear(pL.x,pL.y), sR=laneClear(pR.x,pR.y);
      let d2=0;
      if(sL>s0&&sL>=sR) d2=-1; else if(sR>s0) d2=1;
      if(d2!==0){
        o.ang=gapClamp(i, o.ang+d2*(CFG.AI_MOVE/G.R)*dt);
        o.run+=dt*4; o.face=d2>0?1:-1;
      }
    }
  }
  const c=atkPos(G.carrier);

  // 차징 / 홀드
  if(!b.flying){
    if(G.charging) G.chargeT+=dt;
    G.holdT+=dt;
    if(G.firstPass && G.holdT>CFG.HOLD_DECAY_AT && G.mult>1){
      G.mult=Math.max(1,G.mult-.5*dt);
    }
    b.x=c.x; b.y=c.y+10;
  }

  // 공 비행
  if(b.flying){
    b.flyT+=dt;
    // 유도: 리시버 현재 위치로 제한된 회전 (이동으로 수령 지점 조정)
    if(!b.missFlag){
      const tt=atkPos(b.toIdx);
      const cur=Math.atan2(b.vy,b.vx);
      let des=Math.atan2(tt.y-b.y,tt.x-b.x);
      let dA=des-cur;
      while(dA>Math.PI)dA-=TAU; while(dA<-Math.PI)dA+=TAU;
      const mxr=CFG.HOMING*dt;
      dA=clamp(dA,-mxr,mxr);
      const na=cur+dA, sp2=hyp(b.vx,b.vy);
      b.vx=Math.cos(na)*sp2; b.vy=Math.sin(na)*sp2;
    }
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.rot+=dt*9;
    if(b.flyT>CFG.FLY_MAX){ gameOver('패스 미스'); updateFx(dt); return; }
    const fromS=hyp(b.x-b.sx,b.y-b.sy);
    // 1) 차단 (그레이스 28px 이후)
    if(fromS>CFG.SAFE_DIST){
      for(const df of G.defs){
        if(df.state==='RECOVER'||df.state==='STUN') continue;
        if(hyp(b.x-df.x,b.y-df.y)<CFG.INTERCEPT_R){
          b.flying=false; b.x=df.x; b.y=df.y;
          gameOver('인터셉트'); updateFx(dt); return;
        }
      }
    }
    // 알까기 (경직/기절 수비 통과)
    for(let i=0;i<3;i++){
      const df=G.defs[i];
      if((df.state==='RECOVER'||df.state==='STUN') && !b.nutSet.has(i)
          && hyp(b.x-df.x,b.y-df.y)<CFG.NUTMEG_R){
        b.nutSet.add(i);
        df.state='STUN'; df.stateT=0;
        G.score+=100; G.nutmegs++;
        flashT=.12; shake(5,.2);
        floater('알까기! +100', df.x, df.y-44, {color:'#ffd54a',size:19,life:1.1});
        spark(df.x,df.y,10,'#ffd54a'); sfx.nutmeg();
      }
    }
    // 2) 퍼스트터치 미스 → 필드 밖
    if(hyp(b.x-CX,b.y-CY)>G.R+CFG.OUT_PAD){
      gameOver(b.missFlag?'퍼스트터치 미스':'패스 미스'); updateFx(dt); return;
    }
    if(!b.missFlag){
      // 3) 도착 (리시버 현재 위치 기준 — 마중 나가기 가능)
      const t=atkPos(b.toIdx);
      if(hyp(b.x-t.x,b.y-t.y)<CFG.ARRIVE_R) arriveBall();
    }
  }

  // 수비 AI
  for(const df of G.defs){
    df.cd=Math.max(0,df.cd-dt);
    df.stateT+=dt;
    const spd=diffSpeed();
    if(df.state==='MOVE'){
      // 목표 결정
      let tx,ty;
      if(b.flying){
        if(df.role==='PRESSER'){ tx=b.x; ty=b.y; }
        else { const rp=atkPos(b.toIdx); tx=rp.x; ty=rp.y; }
      } else {
        if(df.role==='PRESSER'){ tx=c.x; ty=c.y; }
        else {
          const adj=df.role==='CUT_L'?(G.carrier+5)%6:(G.carrier+1)%6;
          const ap=atkPos(adj);
          tx=lerp(c.x,ap.x,.6); ty=lerp(c.y,ap.y,.6);
        }
      }
      df.tgtX=tx; df.tgtY=ty;
      const dx=tx-df.x, dy=ty-df.y, dl=hyp(dx,dy);
      if(dl>2){
        const mv=Math.min(spd*dt,dl);
        df.x+=dx/dl*mv; df.y+=dy/dl*mv;
        df.run+=dt*9; df.face=dx>0?1:-1;
      }
      // 스틸 (소유 중 + 36px + 0.25s)
      if(!b.flying && hyp(df.x-c.x,df.y-c.y)<CFG.STEAL_R){
        df.stealT+=dt;
        if(df.stealT>=CFG.STEAL_T){ gameOver('볼 뺏김'); updateFx(dt); return; }
      } else df.stealT=0;
    }
    else if(df.state==='DELAY'){
      // 스틸은 DELAY 중에도 유효
      if(!b.flying && hyp(df.x-c.x,df.y-c.y)<CFG.STEAL_R){
        df.stealT+=dt;
        if(df.stealT>=CFG.STEAL_T){ gameOver('볼 뺏김'); updateFx(dt); return; }
      } else df.stealT=0;
      if(df.stateT>=CFG.LUNGE_DELAY){
        df.state='LUNGE'; df.stateT=0;
        const dx=df.lungeX-df.x, dy=df.lungeY-df.y, dl=hyp(dx,dy)||1;
        df.vx=dx/dl*CFG.LUNGE_SPEED; df.vy=dy/dl*CFG.LUNGE_SPEED;
        dust(df.x,df.y,5);
      }
    }
    else if(df.state==='LUNGE'){
      df.x+=df.vx*dt; df.y+=df.vy*dt;
      df.stealT=0;
      if(df.stateT>=CFG.LUNGE_DUR){
        df.state='RECOVER'; df.stateT=0;
        df.cd=CFG.LUNGE_CD*G.cdMult;
      }
    }
    else if(df.state==='RECOVER'){
      df.stealT=0;
      if(df.stateT>=CFG.RECOVER){ df.state='MOVE'; df.stateT=0; }
    }
    else if(df.state==='STUN'){
      df.stealT=0;
      if(df.stateT>=CFG.STUN){ df.state='MOVE'; df.stateT=0; }
    }
  }
  // 캐리어 달리기 애니 (제자리 바운스)
  for(const a of G.atks) a.run+=dt*4;
  updateFx(dt);
}

// ====================================================================
// 렌더
// ====================================================================
function chargeFracFor(spd){ return clamp((spd-CFG.BALL_MIN)/(CFG.BALL_MAX-CFG.BALL_MIN),0,1); }

function render(){
  g.save();
  if(shakeT>0) g.translate(rand(-shakeAmp,shakeAmp),rand(-shakeAmp,shakeAmp));
  drawField(G?G.R:CFG.R0);
  if(!G){ g.restore(); return; }
  const b=G.ball;
  const ci=b.flying?b.toIdx:G.carrier;
  const c=atkPos(ci);
  const ti=app.screen==='play'&&!G.over ? snapTarget() : -1;

  // 조준 점선 + 타겟 하이라이트
  if(ti>=0){
    const t=atkPos(ti);
    g.setLineDash([7,8]); g.lineDashOffset=-G.time*40;
    g.strokeStyle='rgba(255,213,74,.55)'; g.lineWidth=2;
    g.beginPath(); g.moveTo(c.x,c.y); g.lineTo(t.x,t.y); g.stroke();
    g.setLineDash([]);
    const pu=1+Math.sin(G.time*7)*.12;
    g.strokeStyle='#ffd54a'; g.lineWidth=2.5;
    g.beginPath(); g.arc(t.x,t.y,20*pu,0,TAU); g.stroke();
  }

  // 차지 3존 링 (조작권 캐릭터 주변) — §6 학습 장치
  if(ti>=0){
    const t=atkPos(ti);
    const d=hyp(t.x-c.x,t.y-c.y);
    const req=reqSpeedFor(d);
    const cLo=chargeFracFor((1-CFG.TOL)*req), cHi=chargeFracFor((1+CFG.TOL)*req);
    const RR=30, a0=-Math.PI/2;
    const seg=(f0,f1,col,wid)=>{
      if(f1<=f0) return;
      g.strokeStyle=col; g.lineWidth=wid||5;
      g.beginPath(); g.arc(c.x,c.y,RR,a0+f0*TAU,a0+f1*TAU); g.stroke();
    };
    g.globalAlpha=b.flying?.35:.9;
    seg(0,cLo,'rgba(255,225,77,.65)');
    seg(cLo,cHi,'rgba(108,255,176,.9)');
    seg(cHi,1,'rgba(255,77,77,.75)');
    // 현재 차지 바늘
    if(G.charging&&!b.flying){
      const f=clamp(G.chargeT/CFG.CHARGE_T,0,1);
      const aa=a0+f*TAU;
      g.strokeStyle='#fff'; g.lineWidth=3.4;
      g.beginPath(); g.moveTo(c.x+Math.cos(aa)*(RR-8),c.y+Math.sin(aa)*(RR-8));
      g.lineTo(c.x+Math.cos(aa)*(RR+8),c.y+Math.sin(aa)*(RR+8)); g.stroke();
    }
    g.globalAlpha=1;
  }

  // 스틸 경고 수축 링
  if(!b.flying&&!G.over){
    let mx=0;
    for(const df of G.defs) mx=Math.max(mx,df.stealT/CFG.STEAL_T);
    if(mx>0){
      g.strokeStyle='rgba(255,77,77,'+(0.4+0.5*mx)+')';
      g.lineWidth=3;
      g.beginPath(); g.arc(c.x,c.y,lerp(46,16,mx),0,TAU); g.stroke();
      if(Math.floor(G.time*10)%3===0&&mx>.3) sfx.stealTick();
    }
  }

  // 공격수 (y정렬 없이 단순 — 탑다운)
  for(let i=0;i<6;i++){
    const p=atkPos(i), a=G.atks[i];
    const isC=(i===ci);
    if(isC){
      const pu=1+Math.sin(G.time*6)*.1;
      g.strokeStyle='rgba(255,213,74,.85)'; g.lineWidth=3;
      g.beginPath(); g.arc(p.x,p.y+3,17*pu,0,TAU); g.stroke();
    }
    drawGuy(p.x,p.y,{...ATK_KIT, hair:a.hair, h:isC?32:29,
      run:isC&&!b.flying?a.run*2.2:a.run, face:(pointer.x>p.x?1:-1)});
  }

  // 수비수
  for(const df of G.defs){
    const tilt=G.tiltT>0;
    const o={...DEF_KIT, hair:df.hair, h:28, run:df.run, face:df.face};
    if(tilt) o.jersey='#ff8a2a';
    if(df.state==='DELAY') o.blink=Math.floor(G.time*22)%2===0;
    if(df.state==='LUNGE'){ o.lean=.8; o.leanDir=df.vx>0?1:-1; }
    if(df.state==='RECOVER'||df.state==='STUN'){ o.dark=1; o.xmark=true; o.alpha=.85; }
    drawGuy(df.x,df.y,o);
  }

  // 공 + 트레일
  if(b.flying){
    for(let k=1;k<=4;k++){
      g.globalAlpha=.13*(5-k);
      g.fillStyle='#fff';
      g.beginPath(); g.arc(b.x-b.vx*.012*k,b.y-b.vy*.012*k,9-k*1.4,0,TAU); g.fill();
    }
    g.globalAlpha=1;
  }
  drawBallAt(b.x,b.y,b.flying?10:9,b.rot);

  // HUD
  g.textBaseline='middle';
  txt('SCORE',70,30,12,'#9fb0ca','left',800);
  txt(String(G.score).padStart(6,'0'),70,56,30,'#fff','left',900);
  if(G.mult>1){
    txt('×'+G.mult.toFixed(1),210,56,22,'#8fd3ff','left',900);
  }
  txt('PASS '+G.pass+' · WAVE '+G.wave,730,30,13,'#9fb0ca','right',800);
  txt('BEST '+app.best,730,52,13,'#ffd54a','right',800);
  if(G.tiltT>0) txt('⚠ 수비 빡침 '+G.tiltT.toFixed(0)+'s',CX,30,14,'#ff8a2a','center',900);
  if(G.hintT>0&&!G.over){
    g.globalAlpha=clamp(G.hintT,0,1);
    txt('마우스 조준 · 꾹 차징 · A/D 좌우 이동 — 초록 존이 적정 파워',CX,770,14,'#cfdceb','center',700);
    g.globalAlpha=1;
  }

  drawFx();
  if(flashT>0){
    g.globalAlpha=flashT/.12*.5; g.fillStyle='#fff'; g.fillRect(0,0,W,H); g.globalAlpha=1;
  }
  g.restore();
}

// ====================================================================
// 입력
// ====================================================================
function canvasPos(e){
  const r=cv.getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width*W, y=(e.clientY-r.top)/r.height*H;
  return {x:x,y:y};
}
cv.addEventListener('pointermove',e=>{
  const p=canvasPos(e); pointer.x=p.x; pointer.y=p.y;
});
cv.addEventListener('pointerdown',e=>{
  initAudio(); if(ac&&ac.state==='suspended') ac.resume();
  const p=canvasPos(e); pointer.x=p.x; pointer.y=p.y;
  pointer.down=true;
  if(app.screen!=='play'||!G||G.over) return;
  if(!G.ball.flying){ G.charging=true; G.chargeT=0; sfx.charge(); }
});
window.addEventListener('pointerup',e=>{
  pointer.down=false;
  if(app.screen!=='play'||!G||G.over) return;
  if(G.charging&&!G.ball.flying) releasePass();
  G.charging=false;
});
window.addEventListener('keydown',e=>{
  if(e.code==='KeyP'){ togglePause(); return; }
  keys.add(e.code);
});
window.addEventListener('keyup',e=>{ keys.delete(e.code); });

// ---------- 화면 전환 ----------
function startGame(){
  initAudio(); if(ac&&ac.state==='suspended') ac.resume();
  newGame();
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('over').classList.add('hidden');
  document.getElementById('pauseBtn').classList.remove('hidden');
  app.screen='play'; paused=false;
  document.getElementById('pauseOv').classList.add('hidden');
}
function backToTitle(){
  app.screen='title'; G=null;
  document.getElementById('menuBest').textContent=app.best;
  document.getElementById('menu').classList.remove('hidden');
  document.getElementById('over').classList.add('hidden');
  document.getElementById('pauseBtn').classList.add('hidden');
}
function togglePause(){
  if(app.screen!=='play') return;
  paused=!paused;
  document.getElementById('pauseOv').classList.toggle('hidden',!paused);
}
document.getElementById('startBtn').addEventListener('click',startGame);
document.getElementById('retryBtn').addEventListener('click',()=>{
  if(document.getElementById('retryBtn').classList.contains('lock')) return;
  startGame();
});
document.getElementById('pauseBtn').addEventListener('click',togglePause);
document.getElementById('muteBtn').addEventListener('click',()=>{
  muted=!muted;
  if(masterGain) masterGain.gain.value=muted?0:.8;
  document.getElementById('muteBtn').textContent=muted?'🔇':'🔊';
});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&app.screen==='play'&&!paused) togglePause();
});

// ---------- 메인 루프 ----------
let lastT=0;
function loop(ms){
  const dt=Math.min(.033,(ms-lastT)/1000||0.016);
  lastT=ms;
  if(app.screen==='play'&&!paused) update(dt);
  else updateFx(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
